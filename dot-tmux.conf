#------------------------------------------------
# keybindings
#------------------------------------------------
set -g prefix C-b

# horizontal and vertical splits
bind % split-window -h
bind '"' split-window -v

# cycle to the next / previous window and make it repeatable [-r]
bind -r n next-window
bind -r p previous-window

# cycle to the next / previous pane and make it repeatable [-r]
bind -r o select-pane -t :.+
bind -r O select-pane -t :.-

# timeout for repeatable -r bindings without re-pressing the prefix
set -g repeat-time 1000

#------------------------------------------------
# general
#------------------------------------------------
# count windows and panes from 1, not 0
set -g base-index 1
setw -g pane-base-index 1

set -g default-terminal "tmux-256color"
set -as terminal-features ",alacritty*:RGB"


#------------------------------------------------
# status line
#------------------------------------------------
set -g status-position top

# set two status rows and make the second one empty to produce a visual offset
set -g status 2
set -g status-format[1] ""

# left-align window list
set -g status-justify left

# window redraw interval in seconds
set -g status-interval 5

# no background of its own, so the terminal shows through
set -g status-style "bg=default,fg=colour245"
set -g message-style "bg=default,fg=colour4"

set -g status-left " #[fg=colour4,bold]#S#[default] "
set -g status-left-length 30
set -g window-status-separator ""
set -g window-status-format " [#I #W] "
set -g window-status-style "bg=default,fg=colour244"
set -g window-status-current-format " [#I #W] "
set -g window-status-current-style "bg=default,fg=colour4,bold"

set -g status-right "%H:%M "
